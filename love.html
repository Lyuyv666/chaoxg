<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可以成为我的恋人吗？</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 100vw;
            height: 100vh;
            background: #FFE6EC;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "微软雅黑", sans-serif;
            overflow: hidden;
        }
        .container { text-align: center; z-index: 10; }
        .heart { font-size: 120px; color: #ff4d6d; margin-bottom: 20px; }
        .title { font-size: 24px; color: #333; margin-bottom: 40px; }
        .btn-group { display: flex; gap: 30px; justify-content: center; }
        button {
            padding: 12px 35px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        #btn-yes { background-color: #FF6B8B; color: white; }
        #btn-no { background-color: #7B8CDE; color: white; position: relative; }
        .rain-heart {
            position: fixed;
            font-size: 20px;
            color: #FF6B8B;
            animation: fall linear forwards;
            pointer-events: none;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heart">❤</div>
        <h1 class="title">蒋千千，可以成为我的恋人吗？</h1>
        <div class="btn-group">
            <button id="btn-yes">可以</button>
            <button id="btn-no">不要</button>
        </div>
    </div>

    <script>
        // 逃跑按钮逻辑
        const btnNo = document.getElementById('btn-no');
        function moveAway() {
            const maxX = window.innerWidth - btnNo.offsetWidth - 20;
            const maxY = window.innerHeight - btnNo.offsetHeight - 20;
            btnNo.style.position = 'fixed';
            btnNo.style.left = `${Math.random() * maxX}px`;
            btnNo.style.top = `${Math.random() * maxY}px`;
        }
        btnNo.addEventListener('mouseover', moveAway);
        btnNo.addEventListener('touchstart', moveAway);

        // 点击“可以”触发爱心雨
        document.getElementById('btn-yes').addEventListener('click', () => {
            alert('我就知道你会答应！🥰');
            createRain();
        });

        function createRain() {
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    const h = document.createElement('div');
                    h.className = 'rain-heart';
                    h.textContent = '❤️';
                    h.style.left = `${Math.random() * 100}vw`;
                    h.style.animationDuration = `${Math.random() * 3 + 2}s`;
                    document.body.appendChild(h);
                    setTimeout(() => h.remove(), 5000);
                }, i * 30);
            }
        }
    </script>
</body>
</html>
